let S={};try{S=JSON.parse(localStorage.getItem('pq')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('pq',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pr=n=>n>=5?3:n>=3?2:1, stars=n=>'★'.repeat(pr(n));
const TY={Classify:/classif|categori[sz]e/i,Compare:/compar|differ|contrast/i,Case:/year-old|attending|presents|comes to/i,'Short note':/short note/i,Justify:/justif/i};
D.forEach(d=>d.t=Object.keys(TY).filter(k=>TY[k].test(d.q)));
let F={type:''};
const terms=[...new Set(D.map(d=>d.term))];
terms.forEach(t=>$('term').add(new Option(t,t)));
function items(){const it=$('item');const t=$('term').value;it.length=1;
[...new Map(D.filter(d=>!t||d.term==t).map(d=>[d.term+'|'+d.item,d])).values()].forEach(d=>it.add(new Option(d.item,d.term+'|'+d.item)))}
items();
$('chips').innerHTML=['All',...Object.keys(TY)].map(k=>`<span class="chip" data-k="${k=='All'?'':k}">${k}</span>`).join('');
$('chips').onclick=e=>{if(e.target.dataset.k===undefined)return;F.type=e.target.dataset.k;render()};
$('term').onchange=()=>{items();render()};
['item','pri','sts','sort'].forEach(i=>$(i).onchange=render);$('q').oninput=render;
function flt(){const q=$('q').value.toLowerCase(),t=$('term').value,i=$('item').value,p=+$('pri').value,s=$('sts').value;
let r=D.filter(d=>(!q||d.q.toLowerCase().includes(q))&&(!t||d.term==t)&&(!i||d.term+'|'+d.item==i)&&pr(d.n)>=p&&(!F.type||d.t.includes(F.type))&&(!s||((S[d.id]||{}).s||'n')==s));
if($('sort').value=='f')r=r.slice().sort((a,b)=>b.n-a.n);return r}
function card(d){const x=S[d.id]||{};return `<div class="c ${x.s||''}" data-id="${d.id}"><span class="st">${stars(d.n)}</span> <span class="n">asked ${d.n}×</span>
<div class="qt">${esc(d.q)}</div><div class="cd">${d.codes.join(' · ')}</div>
<div class="act"><button class="d ${x.s=='d'?'on':''}" data-s="d">✓ Done</button><button class="r ${x.s=='r'?'on':''}" data-s="r">↻ Revise</button><button class="w ${x.s=='w'?'on':''}" data-s="w">! Weak</button><button data-s="note">✎ Note</button></div>
${x.o?`<textarea placeholder="Your notes…">${esc(x.nt||'')}</textarea>`:(x.nt?`<div class="cd" style="margin-top:6px">${esc(x.nt)}</div>`:'')}</div>`}
function render(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k==F.type));
const r=flt();let h='',last='';
r.forEach(d=>{const k=d.term+' · '+d.item;if($('sort').value=='s'&&k!=last){h+=`<div class="it">${esc(k)}</div>`;last=k}h+=card(d)});
$('list').innerHTML=h||'<div class="em">No questions match.</div>';stat()}
function stat(){const c={d:0,r:0,w:0};D.forEach(d=>{const s=(S[d.id]||{}).s;if(s)c[s]++});const T=D.length;
$('bar').innerHTML=`<i style="width:${c.d/T*100}%;background:var(--d)"></i><i style="width:${c.r/T*100}%;background:var(--r)"></i><i style="width:${c.w/T*100}%;background:var(--w)"></i>`;
$('stats').textContent=`${Math.round(c.d/T*100)}% done · ${c.d}/${T} done · ${c.r} revise · ${c.w} weak`}
$('list').onclick=e=>{const b=e.target.closest('button'),cd=e.target.closest('.c');if(!b||!cd)return;const id=cd.dataset.id,x=S[id]=S[id]||{};
if(b.dataset.s=='note')x.o=!x.o;else x.s=x.s==b.dataset.s?'':b.dataset.s;save();
const y=scrollY;render();scrollTo(0,y)};
$('list').onchange=e=>{if(e.target.tagName!='TEXTAREA')return;const id=e.target.closest('.c').dataset.id;S[id].nt=e.target.value;save()};
function getExamTarget(){
const saved=localStorage.getItem('pq_exam_date');let target,label='14-12-25',iso='2025-12-14';const now=new Date();
if(saved){const p=saved.split('-');if(p.length===3){target=new Date(+p[0],+p[1]-1,+p[2],9,0,0);label=`${p[2]}-${p[1]}-${p[0].slice(-2)}`;iso=saved}else{target=new Date(saved);iso=saved}}
if(!target||isNaN(target.getTime())){let d=new Date(2025,11,14,9,0,0);if(d.getTime()<now.getTime()){let yr=now.getFullYear();let c=new Date(yr,11,14,9,0,0);if(c.getTime()<now.getTime())c=new Date(yr+1,11,14,9,0,0);target=c;iso=`${c.getFullYear()}-12-14`}else{target=d;iso='2025-12-14'}label='14-12-25'}
return{target,label,iso}}
function updateCd(){
const {target,label,iso}=getExamTarget();const dtEl=$('cdDateText');if(dtEl)dtEl.textContent=label;
const p=$('cdDatePicker');if(p&&!p.value)p.value=iso;
const now=new Date(),diff=target.getTime()-now.getTime(),tEl=$('cdTimer');if(!tEl)return;
if(diff<=0){tEl.innerHTML=diff>-86400000?'<span style="color:var(--d);font-size:12px">Exam Today! 🎯</span>':'<span style="color:var(--mu);font-size:12px">Exam Finished</span>';return}
const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
$('cdDays').textContent=d;$('cdHours').textContent=String(h).padStart(2,'0');$('cdMins').textContent=String(m).padStart(2,'0');$('cdSecs').textContent=String(s).padStart(2,'0')}
$('cdDatePicker').onchange=e=>{if(e.target.value){localStorage.setItem('pq_exam_date',e.target.value);updateCd()}};
setInterval(updateCd,1000);updateCd();
render();
